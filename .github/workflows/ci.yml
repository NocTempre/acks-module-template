name: CI

# Smoke-test the template itself: syntax-check the scripts, scaffold a module
# from the skeleton, and run the canonical build + validate inside it.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax-check template scripts
        run: |
          for f in bin/*.mjs manifest.mjs skeleton/tools/*.mjs; do
            node --check "$f"
          done

      # The scaffold step below validates a module built from skeleton/, in a
      # SIBLING directory, so its ip-scan can never see this tree. This repo is
      # where canon is authored and the one whose pre-commit hook cannot arm
      # itself (no package.json, so `prepare` never runs), which makes a scan of
      # its own tree the only backstop it has. The scanner in skeleton/ is the
      # only one this repo holds, and the one its hook runs.
      - name: Scan this repo's own tree for licensed material
        run: node skeleton/tools/ip-scan.mjs .

      # This repo's hook is a file of its own. It runs the quarantine in
      # skeleton/tools/ and the hook every module is synced runs the one in
      # tools/, so this repo holds no copy of canon at its root for a canon
      # change to leave behind. Nothing runs a hook until a commit does, and
      # a hook that names a file that is not there stops every commit made
      # here. A throwaway repository arms this one and commits through it.
      - name: This repo's pre-commit hook runs the quarantine in skeleton/
        run: node bin/test-pre-commit.mjs

      # The scan's long-literal warning tokenizes source, and a tokenizer that
      # misreads fails quietly in both directions: a comment read as a literal
      # is a warning every module prints for nothing, and a literal read as a
      # comment is a paste nobody is told about. Invented sources pin both.
      - name: IP scan measures literals, not what lies between quote marks
        run: node bin/test-ip-scan.mjs

      # The capture driver's guards run only when a live page stops answering
      # or a toast lands late, which no run can be made to do on demand. A
      # scripted page pins the sequence they depend on: front the page, hide
      # the tray, bound the capture, try once more.
      - name: Capture driver fronts its page and bounds its captures
        run: node bin/test-foundry-capture.mjs

      # The commit tool is the one piece of canon that writes to a branch, and
      # its guards fire only when another session's commit, hunk or staging
      # arrives at the wrong moment. Throwaway repositories stage each of
      # those moments and check what the commit then holds.
      - name: Commit tool commits the gated tree and no peer's hunk
        run: |
          node --check .claude/skills/acks-commit/commit-own-hunks.mjs
          node --check .claude/skills/acks-commit/ledger.mjs
          node --check .claude/skills/acks-commit/lease.mjs
          node bin/test-commit-own-hunks.mjs

      # One run of the commit tool gates and commits at a time. A lease that two
      # runs can hold, or one taken from a run that is still at work, loses a
      # gate or commits under one, and neither shows until two sessions land
      # in the same minute. Runs started side by side check it.
      - name: Landing lease is held by one run at a time
        run: node bin/test-landing-lease.mjs

      # The ledger says whose a line is and the guard says which commands go
      # around the commit tool. Both are wrong silently: a line credited to
      # the wrong session is committed by it, and a command let through
      # commits another session's staging. Payloads shaped as the tools
      # report them, and command lines as sessions write them, check both.
      - name: Edit ledger credits a line to its writer, and the guard refuses a hand-run commit
        run: |
          for f in .claude/hooks/*.mjs; do node --check "$f"; done
          node bin/test-shared-tree-hooks.mjs

      # The sync writes canon into every module repo and its check gates every
      # push they make, and each of its guards fires only in a tree no run
      # stands in by default: an edit nobody has committed, a commit nobody has
      # pushed, a file git cannot give back, a target that is not there.
      # Throwaway repositories stage each one and check what the sync then
      # reads, writes and reports.
      - name: Toolchain sync reads a commit, holds what git cannot give back, and fails a target it did not read
        run: node bin/test-sync-toolchain.mjs

      # The scaffolder builds a module from this tree and has the sync compare
      # it with canon, and what it then says differs only in a tree no run
      # stands in by default: an edit nobody has committed, a commit nobody has
      # pushed, a skeleton the manifest has moved past. Throwaway templates
      # stage each one and check the module, the last line and the exit status.
      - name: Scaffolder says whether the module it built is level with canon
        run: node bin/test-new-module.mjs

      # The checkout is the canon, so the scaffolder is told to compare the
      # module with the files as they stand. It exits 1 where the two differ:
      # a script the manifest enforces and skeleton/package.json lacks, a
      # shared tree the scaffolder does not copy. Nothing else compares a new
      # module with canon before its own first push.
      - name: Scaffold a module from the skeleton, level with canon
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "template-ci"
          node bin/new-module.mjs acks-ci-smoke --worktree --title "CI Smoke" --desc "Scaffold smoke test."

      - name: Build and validate the scaffolded module
        working-directory: ../acks-ci-smoke
        run: |
          npm install --no-audit --no-fund
          npm run build:packs
          npm run validate
          # A scaffolding placeholder is `{{KEY}}` with an UPPERCASE key — that
          # is exactly the set new-module.mjs substitutes. Matching bare `{{`
          # instead catches every mention of Handlebars syntax in prose, and the
          # skeleton's own tooling has to quote it: validate.mjs §8 tells an
          # author to write `{{@root.partId}}` and offers `{{!-- id-ok: … --}}`
          # as the escape hatch. .claude trees are verbatim COPY_DIRS canon that
          # is never rendered, so they cannot hold an unrendered placeholder.
          grep -rnE "\{\{[A-Z][A-Z0-9_]*\}\}" --include="*.json" --include="*.md" --include="*.mjs" . --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=.claude \
            | grep -v "pack-data.mjs" && { echo "::error::unrendered placeholders"; exit 1; } || echo "placeholders fully rendered"

      # The scaffold above has nothing for a gate to catch, so it proves only
      # that canon passes a clean module. This feeds the validator invented
      # modules it must fail, borrowing the scaffold's handlebars install —
      # this repo has no package.json to install one of its own.
      - name: Validator gates fail what they exist to catch
        run: node bin/test-validate.mjs ../acks-ci-smoke/node_modules

      # The hook suite reports what git does with a hook at the mode the index
      # holds for it, in a fixture. This step reports the things that fixture
      # stands in for, each with its hook as git gave it: a clone of this
      # repository armed by hand, and the module scaffolded above, armed by its
      # own `npm install`. The module then commits once more with its hook made
      # executable, which tells the mode apart from everything else a hook
      # needs. Last, a module is scaffolded from a skeleton whose hook is
      # executable on disk, as a checkout of an entry tracked 100755 leaves it.
      # The step runs last, because it commits in the scaffold and changes a
      # mode in this checkout, and it asserts nothing: errors are not fatal and
      # it ends on `exit 0`.
      - name: Report what a commit does with a hook at the mode git gave it
        run: |
          set +e
          modes() {
            echo "tracked $(git -C "$1" ls-files -s "$2" | cut -d' ' -f1), $(stat -c %a "$1/$2") on disk"
          }
          commit_through() {
            echo "== $1"
            cd "$2" || return
            echo "$(modes . .githooks/pre-commit), core.hooksPath=$(git config --get core.hooksPath), core.fileMode=$(git config --get core.fileMode)"
            mkdir -p ruledata probe
            echo '{}' > "ruledata/$3.json"
            echo clean > "probe/$3.txt"
            git add "ruledata/$3.json" "probe/$3.txt"
            git commit -m "a banned path beside a clean file" > ../commit.out 2>&1
            echo "git commit exited $?"
            sed 's/^/  | /' ../commit.out
            echo "the commit writes: $(git show --name-only --format= HEAD | tr '\n' ' ')"
            cd "$GITHUB_WORKSPACE" || exit 0
          }
          git --version
          echo "umask $(umask); hook settings this git knows: $(git help -c | grep -E '^(hook\.|core\.hooksPath|advice\.ignoredHook)' | tr '\n' ' ')"
          echo "this checkout's hook: $(modes . .githooks/pre-commit); the skeleton's: $(modes . skeleton/.githooks/pre-commit)"
          git clone -q "file://$GITHUB_WORKSPACE" ../acks-ci-clone
          git -C ../acks-ci-clone config core.hooksPath .githooks
          commit_through "a clone of this repository, armed by hand" ../acks-ci-clone first
          commit_through "the scaffolded module, armed by npm install" ../acks-ci-smoke first
          chmod +x ../acks-ci-smoke/.githooks/pre-commit
          commit_through "the same module, its hook made executable" ../acks-ci-smoke second
          chmod +x skeleton/.githooks/pre-commit
          echo "== a module scaffolded from a skeleton whose hook is $(stat -c %a skeleton/.githooks/pre-commit) on disk"
          node bin/new-module.mjs acks-ci-exec --worktree --title "CI Exec" --desc "Scaffolded from an executable hook." | tail -n 1
          modes ../acks-ci-exec .githooks/pre-commit
          exit 0
